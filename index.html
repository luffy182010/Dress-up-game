<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dress Up Game</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <!-- الشخصية -->
    <div class="character-section">

        <div class="character">

            <!-- الجسم -->
            <img id="body" class="layer"
                 src="Img/body/1783954979457.png">

            <!-- الملابس -->
            <img id="clothes" class="layer"
                 src="Img/Clothes/dress1.png">

            <!-- الأحذية -->
            <img id="shoes" class="layer"
                 src="Img/shoes/shoes1.png">

            <!-- الشعر -->
            <img id="hair" class="layer"
                 src="Img/hair/back/front1.png">

            <!-- العيون -->
            <img id="eyes" class="layer"
                 src="Img/eyes/eyes1.png">

        </div>

    </div>

    <!-- القائمة -->
    <div class="menu-section">

        <div class="title">
            <h2>Dress Up Game</h2>
        </div>

        <div class="tabs">

            <button class="tab active" data-category="clothes">
                👗 Clothes
            </button>

            <button class="tab" data-category="hair">
                💇 Hair
            </button>

            <button class="tab" data-category="eyes">
                👁 Eyes
            </button>

            <button class="tab" data-category="shoes">
                👟 Shoes
            </button>

        </div>

        <div class="items-grid" id="itemsGrid">

        </div>

    </div>

</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>

</body>
</html>
