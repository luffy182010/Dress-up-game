<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dress Up Game</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <!-- الشخصية -->
    <section class="character-section">

        <div class="character">

            <!-- الجسم -->
            <img src="images/body/body1.png"
                 id="body"
                 class="layer">

            <!-- الملابس -->
            <img src="images/clothes/clothes1.png"
                 id="clothes"
                 class="layer">

            <!-- الأحذية -->
            <img src="images/shoes/shoes1.png"
                 id="shoes"
                 class="layer">

            <!-- الشعر الخلفي -->
            <img src="images/hair/back/back1.png"
                 id="hairBack"
                 class="layer">

            <!-- العيون -->
            <img src="images/eyes/eyes1.png"
                 id="eyes"
                 class="layer">

            <!-- الشعر الأمامي -->
            <img src="images/hair/front/front1.png"
                 id="hairFront"
                 class="layer">

        </div>

    </section>

    <!-- القائمة -->
    <section class="menu-section">

        <div class="header">
            <h2>Dress Up</h2>
        </div>

        <div class="tabs">

            <button class="tab active"
                    data-category="clothes">
                👗 Clothes
            </button>

            <button class="tab"
                    data-category="hair">
                💇 Hair
            </button>

            <button class="tab"
                    data-category="eyes">
                👁 Eyes
            </button>

            <button class="tab"
                    data-category="shoes">
                👟 Shoes
            </button>

        </div>

        <!-- هنا ستظهر الملابس -->
        <div id="itemsGrid"
             class="items-grid">

        </div>

    </section>

</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>

</body>
</html>
